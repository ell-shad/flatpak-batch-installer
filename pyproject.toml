[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flathub-catalog-installer"
version = "0.2.0"
description = "Browse/search the Flathub catalog, select multiple apps, install them in one Flatpak operation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Flathub Catalog Installer contributors" }]
keywords = ["flatpak", "flathub", "linux", "installer", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
flathub-gui = "flathub_gui.app:main"

[project.urls]
Homepage = "https://github.com/example/flathub-catalog-installer"
Issues = "https://github.com/example/flathub-catalog-installer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flathub_gui*"]
