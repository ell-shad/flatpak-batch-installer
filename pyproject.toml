[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flatpak-batch-installer"
version = "0.5.0"
description = "Browse/search the Flathub catalog, select multiple apps, install them in one Flatpak operation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["ttkbootstrap>=1.10"]
license = { text = "MIT" }
authors = [{ name = "Flatpak Batch Installer contributors" }]
keywords = ["flatpak", "flathub", "linux", "installer", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
flatpak-batch-installer = "flatpak_batch_installer.app:main"

[project.urls]
Homepage = "https://github.com/example/flatpak-batch-installer"
Issues = "https://github.com/example/flatpak-batch-installer/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flatpak_batch_installer*"]

[tool.setuptools.package-data]
flatpak_batch_installer = ["data/*.png"]
